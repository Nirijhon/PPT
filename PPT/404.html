<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide Not Found — SlideCraft Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @tailwind base;
    @tailwind components;
    @tailwind utilities;
    @layer utilities {
      body { background: radial-gradient(120% 120% at 50% 40%, #0B192C 0%, #050C16 65%, #000 100%); }
      .gold { color: #FFD700; }
      .gold-border { border-color: #FFD700; }
      .gold-bg { background: linear-gradient(180deg, #FFD700, #FBBF24); }
      .golden-glow { box-shadow: 0 0 0 3px rgba(255,215,0,.25), 0 8px 26px rgba(255,215,0,.18); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">
  <div class="max-w-xl w-full mx-4">
    <!-- Ornamental gold divider -->
    <div class="relative h-px w-full bg-gray-700/60 mb-8">
      <span class="absolute -translate-x-1/2 top-1/2 left-1/2 w-10 h-px bg-gradient-to-r from-transparent via-amber-400 to-transparent"></span>
      <span class="absolute -translate-x-1/2 top-1/2 left-1/2 -translate-y-1/2 w-3 h-3 rounded-full gold-bg"></span>
    </div>

    <div class="text-center">
      <i class="fa-solid fa-mountain-sun gold text-7xl mb-4"></i>
      <h1 class="text-6xl font-black mb-2">404</h1>
      <p class="text-gray-300 mb-2">Oops — that slide hasn’t been crafted yet.</p>
      <p class="text-sm text-gray-400 mb-8">The page you’re looking for doesn’t exist or was removed.</p>
    </div>

    <div class="text-center">
      <a href="/" class="inline-flex items-center justify-center gap-2 px-7 py-3 rounded-xl gold-bg text-[#0B192C] font-black tracking-wider golden-glow hover:brightness-110 transition">
        <i class="fa-solid fa-arrow-left"></i> Back to the Studio
      </a>
    </div>

    <div class="relative h-px w-full bg-gray-700/60 mt-8">
      <span class="absolute -translate-x-1/2 top-1/2 left-1/2 w-10 h-px bg-gradient-to-r from-transparent via-amber-400 to-transparent"></span>
      <span class="absolute -translate-x-1/2 top-1/2 left-1/2 -translate-y-1/2 w-3 h-3 rounded-full gold-bg"></span>
    </div>

    <p class="mt-6 text-center text-xs text-gray-500">SlideCraft Studio · Brand your sermon slides in seconds.</p>
  </div>
</body>
</html>
