<!-- components/point-slide.html -->
<div class="relative w-full max-w-[1280px] aspect-video bg-[#0B192C] border-[6px] border-[#FFD700]/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between p-12 md:p-16 font-sans">

    <!-- Background Visual Layering: Radial Center Glow & Double Frame -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/50 via-[#0B192C] to-[#050C16] pointer-events-none"></div>
    <div class="absolute inset-4 border border-[#FFD700]/20 rounded-xl pointer-events-none"></div>

    <!-- Top Point Indicator Badge -->
    <div class="relative z-10 flex justify-center">
        <span class="bg-[#FFD700] text-[#0B192C] text-sm md:text-xl font-black tracking-[0.25em] uppercase px-8 py-2 rounded-full shadow-lg">
            POINT 01
        </span>
    </div>

    <!-- Main Sermon Point (High Impact, Auto-Balanced, Gradient Highlight) -->
    <div class="relative z-10 text-center my-auto px-6">
        <h2 class="text-white text-5xl md:text-7xl font-black tracking-tight leading-[1.2] drop-shadow-[0_10px_20px_rgba(0,0,0,0.9)] [text-wrap:balance]">
            GOD IS FAITHFUL TO FULFILL <br />
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#FFD700] via-[#FFF3B0] to-[#FFD700]">
                EVERY PROMISE
            </span>
        </h2>
    </div>

    <!-- Bottom Sub-Point Card -->
    <div class="relative z-10 flex justify-center">
        <div class="bg-[#132A4A]/90 border-t-2 border-[#FFD700]/50 px-8 py-3 rounded-lg shadow-xl text-center backdrop-blur-sm">
            <p class="text-slate-200 text-base md:text-xl font-semibold tracking-wide">
                Trust in His timing, not in your current circumstances.
            </p>
        </div>
    </div>

</div>
